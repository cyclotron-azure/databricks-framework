[project]
name = "databricks-unit-test-framework"
version = "0.1.0"
description = "PySpark transformations with pytest, coverage and Databricks Asset Bundles"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pyspark>=3.5,<4.0"
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_unit_test_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests requiring Databricks workspace resources"
]

[tool.coverage.run]
branch = true
source = ["src/databricks_unit_test_framework"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
