bundle:
  name: databricks_unit_test_framework

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog
    default: main
  schema:
    description: Target schema
    default: demo
  warehouse_id:
    description: SQL warehouse ID used by integration tests
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}

  stage:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal_name}

  prod:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal_name}
